<div class="module-container">
    <div class="module-header">
        <div>
            <h2 class="module-title">Contacts</h2>
            <p class="text-muted mb-0" id="contactCount">0 contacts</p>
        </div>
        <div>
            <button class="btn learn-btn me-2" onclick="showContactsGuide()">
                <i class="bi bi-book"></i> Learn
            </button>
            <label class="btn btn-outline-primary me-2" style="cursor: pointer;">
                <i class="bi bi-upload"></i> Upload XLSX/CSV
                <input type="file" id="importFile" accept=".xlsx,.xls,.csv" 
                       style="display: none;" onchange="previewImportFile(event)">
            </label>
            <button class="btn btn-outline-success me-2" onclick="exportContacts()">
                <i class="bi bi-download"></i> Export
            </button>
            <button class="btn btn-primary" onclick="showAddContactModal()">
                <i class="bi bi-person-plus"></i> Add Contact
            </button>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" placeholder="Search contacts..." 
                               id="contactSearch" onkeyup="debounceSearch()">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="statusFilter" onchange="loadContacts(1)">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="unsubscribed">Unsubscribed</option>
                        <option value="bounced">Bounced</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="pageSize" onchange="changePageSize()">
                        <option value="10">10 per page</option>
                        <option value="25" selected>25 per page</option>
                        <option value="50">50 per page</option>
                        <option value="100">100 per page</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Company</th>
                            <th>Status</th>
                            <th>Added</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody">
                        <tr><td colspan="6" class="text-center py-5">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <div>
            <small class="text-muted">Showing <span id="showingCount">0</span> of <span id="totalCount">0</span> contacts</small>
        </div>
        <nav>
            <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
        </nav>
    </div>
</div>

<!-- Import Preview Modal -->
<div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Import Preview</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info">
                    <strong id="importRowCount">0</strong> contacts found
                </div>
                <div class="table-responsive mb-3" style="max-height: 200px; overflow-y: auto;">
                    <table class="table table-sm table-bordered">
                        <thead id="importHeaders"></thead>
                        <tbody id="importRows"></tbody>
                    </table>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Email Column *</label>
                        <select class="form-select" id="emailColumn">
                            <option value="">Select...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Name Column</label>
                        <select class="form-select" id="nameColumn">
                            <option value="">Select...</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="btn btn-primary w-100" id="importNowBtn" onclick="importContacts()">
                    <i class="bi bi-upload"></i> Import Now
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Add Contact Modal -->
<div class="modal fade" id="contactModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Contact</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-control" id="contactEmail">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Company</label>
                    <input type="text" class="form-control" id="contactCompany">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="saveContact()">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
let contactsState = {
    contacts: [],
    importData: [],
    importHeaders: [],
    currentPage: 1,
    pageSize: 25,
    totalPages: 1,
    totalCount: 0,
    searchQuery: ''
};

function initContactsModule() {
    loadContacts(1);
}

async function loadContacts(page) {
    contactsState.currentPage = page || 1;
    const searchText = document.getElementById('contactSearch').value.trim();
    const statusFilter = document.getElementById('statusFilter').value;
    contactsState.pageSize = parseInt(document.getElementById('pageSize').value);
    
    try {
        const start = (contactsState.currentPage - 1) * contactsState.pageSize;
        const end = start + contactsState.pageSize - 1;
        
        let query = gbSupabase.client
            .from('contacts')
            .select('*', { count: 'exact' })
            .eq('user_id', gbApp.currentUser.id);
        
        // Apply search
        if (searchText) {
            query = query.or(`email.ilike.%${searchText}%,first_name.ilike.%${searchText}%,last_name.ilike.%${searchText}%`);
        }
        
        // Apply status filter
        if (statusFilter) {
            query = query.eq('status', statusFilter);
        }
        
        query = query
            .order('created_at', { ascending: false })
            .range(start, end);
        
        const { data, error, count } = await query;
        
        if (error) { console.error(error); return; }
        
        contactsState.contacts = data || [];
        contactsState.totalCount = count || 0;
        contactsState.totalPages = Math.ceil(contactsState.totalCount / contactsState.pageSize);
        
        document.getElementById('contactCount').textContent = `${contactsState.totalCount} contacts`;
        document.getElementById('showingCount').textContent = contactsState.contacts.length;
        document.getElementById('totalCount').textContent = contactsState.totalCount;
        
        renderContactsTable();
        renderPagination();
        
    } catch (error) {
        console.error('Error:', error);
    }
}

function renderContactsTable() {
    const tbody = document.getElementById('contactsTableBody');
    
    if (contactsState.contacts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5">No contacts found</td></tr>';
        return;
    }
    
    tbody.innerHTML = contactsState.contacts.map(c => `
        <tr>
            <td>${c.first_name || ''} ${c.last_name || ''}</td>
            <td>${c.email}</td>
            <td>${c.company || '-'}</td>
            <td><span class="badge bg-${c.status === 'active' ? 'success' : 'warning'}">${c.status || 'active'}</span></td>
            <td>${GBUtils.formatDate(c.created_at, 'short')}</td>
            <td><button class="btn btn-sm btn-outline-danger" onclick="deleteContact('${c.id}')">Delete</button></td>
        </tr>
    `).join('');
}

function renderPagination() {
    const pagination = document.getElementById('pagination');
    
    if (contactsState.totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }
    
    let html = '';
    
    // Previous
    html += `<li class="page-item ${contactsState.currentPage === 1 ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="loadContacts(${contactsState.currentPage - 1})">«</a>
    </li>`;
    
    // Pages
    for (let i = 1; i <= contactsState.totalPages; i++) {
        if (i === 1 || i === contactsState.totalPages || 
            (i >= contactsState.currentPage - 2 && i <= contactsState.currentPage + 2)) {
            html += `<li class="page-item ${i === contactsState.currentPage ? 'active' : ''}">
                <a class="page-link" href="#" onclick="loadContacts(${i})">${i}</a>
            </li>`;
        } else if (i === contactsState.currentPage - 3 || i === contactsState.currentPage + 3) {
            html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
        }
    }
    
    // Next
    html += `<li class="page-item ${contactsState.currentPage === contactsState.totalPages ? 'disabled' : ''}">
        <a class="page-link" href="#" onclick="loadContacts(${contactsState.currentPage + 1})">»</a>
    </li>`;
    
    pagination.innerHTML = html;
}

function debounceSearch() {
    clearTimeout(window.searchTimeout);
    window.searchTimeout = setTimeout(() => {
        loadContacts(1);
    }, 400);
}

function changePageSize() {
    loadContacts(1);
}

function previewImportFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const fileName = file.name.toLowerCase();
    const reader = new FileReader();
    
    reader.onload = function(e) {
        try {
            let data = [];
            let headers = [];
            
            if (fileName.endsWith('.csv')) {
                const text = e.target.result;
                const lines = text.split('\n');
                if (lines.length < 2) { showToast('Empty file', 'error'); return; }
                
                headers = lines[0].split(',').map(h => h.trim());
                
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const values = lines[i].split(',');
                    const row = {};
                    headers.forEach((h, idx) => {
                        row[h] = values[idx] ? values[idx].trim() : '';
                    });
                    if (row[headers[0]]) data.push(row);
                }
            } else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                if (typeof XLSX === 'undefined') {
                    showToast('Please refresh page to load XLSX library', 'error');
                    return;
                }
                const workbook = XLSX.read(e.target.result, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                data = XLSX.utils.sheet_to_json(worksheet);
                if (data.length > 0) headers = Object.keys(data[0]);
            }
            
            if (data.length === 0) { showToast('No data found', 'error'); return; }
            
            contactsState.importData = data;
            contactsState.importHeaders = headers;
            
            document.getElementById('importRowCount').textContent = data.length;
            
            const emailSelect = document.getElementById('emailColumn');
            emailSelect.innerHTML = '<option value="">Select...</option>' + headers.map(h => {
                const lower = h.toLowerCase();
                const isEmail = lower.includes('email') || lower.includes('mail');
                return `<option value="${h}" ${isEmail ? 'selected' : ''}>${h}</option>`;
            }).join('');
            
            const nameSelect = document.getElementById('nameColumn');
            nameSelect.innerHTML = '<option value="">Select...</option>' + headers.map(h => {
                const lower = h.toLowerCase();
                const isName = lower.includes('name') || lower.includes('first');
                return `<option value="${h}" ${isName ? 'selected' : ''}>${h}</option>`;
            }).join('');
            
            document.getElementById('importHeaders').innerHTML = 
                '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>';
            
            document.getElementById('importRows').innerHTML = 
                data.slice(0, 5).map(row => 
                    '<tr>' + headers.map(h => `<td>${row[h] || ''}</td>`).join('') + '</tr>'
                ).join('');
            
            new bootstrap.Modal(document.getElementById('importModal')).show();
            
        } catch (error) {
            console.error('Error:', error);
            showToast('Error: ' + error.message, 'error');
        }
    };
    
    if (fileName.endsWith('.csv')) {
        reader.readAsText(file);
    } else {
        reader.readAsArrayBuffer(file);
    }
}

async function importContacts() {
    const emailCol = document.getElementById('emailColumn').value;
    const nameCol = document.getElementById('nameColumn').value;
    
    if (!emailCol) { showToast('Select email column', 'error'); return; }
    
    const btn = document.getElementById('importNowBtn');
    btn.disabled = true;
    btn.textContent = 'Importing...';
    
    let added = 0, skipped = 0;
    
    for (const row of contactsState.importData) {
        const email = String(row[emailCol] || '').trim().toLowerCase();
        if (!email || !email.includes('@')) { skipped++; continue; }
        
        const { data: existing } = await gbSupabase.client
            .from('contacts').select('id')
            .eq('email', email).eq('user_id', gbApp.currentUser.id);
        
        if (existing && existing.length > 0) { skipped++; continue; }
        
        let firstName = '', lastName = '';
        if (nameCol && row[nameCol]) {
            const parts = String(row[nameCol]).trim().split(/\s+/);
            firstName = parts[0] || '';
            lastName = parts.slice(1).join(' ') || '';
        }
        
        const { error } = await gbSupabase.client.from('contacts').insert({
            user_id: gbApp.currentUser.id,
            email, first_name: firstName, last_name: lastName,
            company: row['Company'] || row['company'] || '',
            status: 'active', subscribed: true
        });
        
        if (error) { skipped++; } else { added++; }
    }
    
    btn.disabled = false;
    btn.textContent = 'Import Now';
    
    bootstrap.Modal.getInstance(document.getElementById('importModal')).hide();
    showToast(`${added} imported, ${skipped} skipped`, 'success');
    loadContacts(1);
}

async function saveContact() {
    const email = document.getElementById('contactEmail').value.trim();
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const company = document.getElementById('contactCompany').value.trim();
    
    if (!email) { showToast('Enter email', 'error'); return; }
    
    const { error } = await gbSupabase.client.from('contacts').insert({
        user_id: gbApp.currentUser.id,
        email, first_name: firstName, last_name: lastName,
        company, status: 'active', subscribed: true
    });
    
    if (error) { showToast('Error', 'error'); }
    else {
        bootstrap.Modal.getInstance(document.getElementById('contactModal')).hide();
        showToast('Added!', 'success');
        loadContacts(1);
    }
}

async function deleteContact(id) {
    if (!confirm('Delete?')) return;
    await gbSupabase.delete('contacts', { id });
    loadContacts(contactsState.currentPage);
}

function showAddContactModal() {
    document.getElementById('contactEmail').value = '';
    document.getElementById('firstName').value = '';
    document.getElementById('lastName').value = '';
    document.getElementById('contactCompany').value = '';
    new bootstrap.Modal(document.getElementById('contactModal')).show();
}

function showContactsGuide() {
    showToast('Upload XLSX/CSV with email column', 'info');
}

async function exportContacts() {
    const { data } = await gbSupabase.client
        .from('contacts').select('*').eq('user_id', gbApp.currentUser.id);
    
    const exportData = (data || []).map(c => ({
        'First Name': c.first_name || '',
        'Last Name': c.last_name || '',
        'Email': c.email,
        'Company': c.company || ''
    }));
    
    GBUtils.exportToCSV(exportData, 'contacts.csv');
}

window.showContactsGuide = showContactsGuide;
window.previewImportFile = previewImportFile;
window.importContacts = importContacts;
window.exportContacts = exportContacts;
window.showAddContactModal = showAddContactModal;
window.saveContact = saveContact;
window.deleteContact = deleteContact;
window.debounceSearch = debounceSearch;
window.loadContacts = loadContacts;
window.changePageSize = changePageSize;
</script>
