<div class="module-container">
    <!-- Header -->
    <div class="module-header">
        <div>
            <h2 class="module-title">Contacts</h2>
            <p class="text-muted mb-0" id="contactCount">0 contacts</p>
        </div>
        <div>
            <button class="btn btn-outline-primary me-2" onclick="showImportModal()">
                <i class="bi bi-upload"></i> Import CSV
            </button>
            <button class="btn btn-outline-success me-2" onclick="exportContacts()">
                <i class="bi bi-download"></i> Export
            </button>
            <button class="btn btn-primary" onclick="showAddContactModal()">
                <i class="bi bi-person-plus"></i> Add Contact
            </button>
        </div>
    </div>

    <!-- Search and Filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" placeholder="Search contacts..." id="contactSearch" onkeyup="debounceSearch()">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="tagFilter" onchange="loadContacts()">
                        <option value="">All Tags</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="listFilter" onchange="loadContacts()">
                        <option value="">All Lists</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="statusFilter" onchange="loadContacts()">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="unsubscribed">Unsubscribed</option>
                        <option value="bounced">Bounced</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Bulk Actions Bar (hidden by default) -->
    <div id="bulkActions" class="alert alert-primary d-none">
        <div class="d-flex justify-content-between align-items-center">
            <span><strong id="selectedCount">0</strong> contacts selected</span>
            <div>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="bulkAddTag()">
                    <i class="bi bi-tag"></i> Add Tag
                </button>
                <button class="btn btn-sm btn-outline-success me-1" onclick="bulkAddToList()">
                    <i class="bi bi-list-plus"></i> Add to List
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="bulkDelete()">
                    <i class="bi bi-trash"></i> Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Contacts Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th width="40">
                                <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                            </th>
                            <th onclick="sortContacts('first_name')" style="cursor:pointer">
                                Name <i class="bi bi-arrow-down-up"></i>
                            </th>
                            <th onclick="sortContacts('email')" style="cursor:pointer">
                                Email <i class="bi bi-arrow-down-up"></i>
                            </th>
                            <th>Company</th>
                            <th>Tags</th>
                            <th>Status</th>
                            <th onclick="sortContacts('created_at')" style="cursor:pointer">
                                Added <i class="bi bi-arrow-down-up"></i>
                            </th>
                            <th width="100">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody">
                        <tr>
                            <td colspan="8" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-between align-items-center mt-3">
        <div>
            <select class="form-select form-select-sm" id="pageSize" onchange="changePageSize()" style="width: auto; display: inline-block;">
                <option value="10">10 per page</option>
                <option value="25">25 per page</option>
                <option value="50">50 per page</option>
                <option value="100">100 per page</option>
            </select>
        </div>
        <nav>
            <ul class="pagination pagination-sm mb-0" id="pagination">
            </ul>
        </nav>
    </div>
</div>

<!-- Add/Edit Contact Modal -->
<div class="modal fade" id="contactModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="contactModalTitle">Add Contact</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="contactForm">
                    <input type="hidden" id="contactId">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" id="contactEmail" required>
                        <div id="emailValidation" class="form-text"></div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Company</label>
                            <input type="text" class="form-control" id="contactCompany">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" id="contactPhone">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Tags</label>
                        <input type="text" class="form-control" id="contactTags" placeholder="tag1, tag2, tag3">
                        <small class="text-muted">Separate tags with commas</small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveContact()">
                    <i class="bi bi-check-lg"></i> Save Contact
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Import CSV Modal -->
<div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Import Contacts</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Upload CSV File</label>
                    <input type="file" class="form-control" id="csvFile" accept=".csv" onchange="previewCSV()">
                </div>
                
                <div id="csvPreview" class="d-none">
                    <h6>Preview:</h6>
                    <div class="table-responsive mb-3" style="max-height: 200px; overflow-y: auto;">
                        <table class="table table-sm table-bordered">
                            <thead id="csvHeaders"></thead>
                            <tbody id="csvRows"></tbody>
                        </table>
                    </div>
                    
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i>
                        <strong id="csvRowCount">0</strong> contacts found
                        <br>
                        <small>Duplicates will be detected during import</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Column Mapping</label>
                        <div class="row" id="columnMapping">
                            <!-- Dynamic mapping fields -->
                        </div>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="skipDuplicates" checked>
                        <label class="form-check-label">Skip duplicate emails</label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="importBtn" onclick="importContacts()" disabled>
                    <i class="bi bi-upload"></i> Import
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Add Tag Modal -->
<div class="modal fade" id="tagModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Tag</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="text" class="form-control" id="newTag" placeholder="Enter tag name">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="applyTag()">Apply</button>
            </div>
        </div>
    </div>
</div>

<!-- Add to List Modal -->
<div class="modal fade" id="listModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add to List</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <select class="form-select" id="listSelect">
                    <option value="">Select list...</option>
                </select>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="applyList()">Add</button>
            </div>
        </div>
    </div>
</div>

<script>
// Contacts Module State
let contactsState = {
    contacts: [],
    filteredContacts: [],
    selectedContacts: new Set(),
    currentPage: 1,
    pageSize: 25,
    totalPages: 1,
    searchQuery: '',
    sortColumn: 'created_at',
    sortOrder: 'desc',
    csvData: [],
    csvMapping: {}
};

// Initialize Contacts Module
function initContactsModule() {
    loadTags();
    loadLists();
    loadContacts();
}

// Backup initialization
document.addEventListener('DOMContentLoaded', () => {
    if (document.getElementById('contactsTableBody')) {
        initContactsModule();
    }
});

// Load Contacts from Supabase
async function loadContacts(page = 1) {
    contactsState.currentPage = page;
    
    try {
        const start = (page - 1) * contactsState.pageSize;
        const end = start + contactsState.pageSize - 1;
        
        let query = gbSupabase.client
            .from('contacts')
            .select('*', { count: 'exact' })
            .eq('user_id', gbApp.currentUser.id);
        
        // Apply search
        if (contactsState.searchQuery) {
            query = query.or(`first_name.ilike.%${contactsState.searchQuery}%,last_name.ilike.%${contactsState.searchQuery}%,email.ilike.%${contactsState.searchQuery}%,company.ilike.%${contactsState.searchQuery}%`);
        }
        
        // Apply filters
        const tagFilter = document.getElementById('tagFilter').value;
        const statusFilter = document.getElementById('statusFilter').value;
        
        if (tagFilter) {
            query = query.contains('tags', [tagFilter]);
        }
        
        if (statusFilter) {
            query = query.eq('status', statusFilter);
        }
        
        // Apply sorting
        query = query.order(contactsState.sortColumn, { ascending: contactsState.sortOrder === 'asc' });
        
        // Apply pagination
        query = query.range(start, end);
        
        const { data, error, count } = await query;
        
        if (error) throw error;
        
        contactsState.contacts = data || [];
        contactsState.totalPages = Math.ceil((count || 0) / contactsState.pageSize);
        
        updateContactCount(count || 0);
        renderContactsTable();
        renderPagination();
        
    } catch (error) {
        console.error('Error loading contacts:', error);
        showToast('Failed to load contacts: ' + error.message, 'error');
    }
}

// Render Contacts Table
function renderContactsTable() {
    const tbody = document.getElementById('contactsTableBody');
    
    if (contactsState.contacts.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="8" class="text-center py-5">
                    <i class="bi bi-people" style="font-size: 3rem; color: #ccc;"></i>
                    <p class="text-muted mt-2 mb-0">No contacts found</p>
                    <button class="btn btn-primary btn-sm mt-2" onclick="showAddContactModal()">
                        <i class="bi bi-person-plus"></i> Add Your First Contact
                    </button>
                </td>
            </tr>
        `;
        return;
    }
    
    tbody.innerHTML = contactsState.contacts.map(contact => `
        <tr class="${contact.status === 'unsubscribed' ? 'table-warning' : contact.status === 'bounced' ? 'table-danger' : ''}">
            <td>
                <input type="checkbox" class="contact-checkbox" value="${contact.id}" 
                    ${contactsState.selectedContacts.has(contact.id) ? 'checked' : ''}
                    onchange="toggleContactSelection('${contact.id}', this.checked)">
            </td>
            <td>
                <div class="d-flex align-items-center">
                    <div class="contact-avatar me-2" style="background: ${getAvatarColor(contact.email)}">
                        ${getInitials(contact.first_name, contact.last_name, contact.email)}
                    </div>
                    <div>
                        <div class="fw-bold">${contact.first_name || ''} ${contact.last_name || ''}</div>
                    </div>
                </div>
            </td>
            <td>${contact.email}</td>
            <td>${contact.company || '-'}</td>
            <td>
                ${(contact.tags || []).map(tag => 
                    `<span class="badge bg-light text-dark me-1">${tag}</span>`
                ).join('')}
            </td>
            <td>
                ${contact.status === 'active' ? '<span class="badge bg-success">Active</span>' : 
                  contact.status === 'unsubscribed' ? '<span class="badge bg-warning">Unsubscribed</span>' :
                  '<span class="badge bg-danger">Bounced</span>'}
            </td>
            <td>${GBUtils.formatDate(contact.created_at, 'short')}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="editContact('${contact.id}')" title="Edit">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteContact('${contact.id}')" title="Delete">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

// Render Pagination
function renderPagination() {
    const pagination = document.getElementById('pagination');
    
    if (contactsState.totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }
    
    let html = '';
    
    // Previous button
    html += `
        <li class="page-item ${contactsState.currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadContacts(${contactsState.currentPage - 1})">&laquo;</a>
        </li>
    `;
    
    // Page numbers
    for (let i = 1; i <= contactsState.totalPages; i++) {
        if (i === 1 || i === contactsState.totalPages || 
            (i >= contactsState.currentPage - 2 && i <= contactsState.currentPage + 2)) {
            html += `
                <li class="page-item ${contactsState.currentPage === i ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadContacts(${i})">${i}</a>
                </li>
            `;
        } else if (i === contactsState.currentPage - 3 || i === contactsState.currentPage + 3) {
            html += '<li class="page-item disabled"><span class="page-link">...</span></li>';
        }
    }
    
    // Next button
    html += `
        <li class="page-item ${contactsState.currentPage === contactsState.totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadContacts(${contactsState.currentPage + 1})">&raquo;</a>
        </li>
    `;
    
    pagination.innerHTML = html;
}

// Show Add Contact Modal
function showAddContactModal() {
    document.getElementById('contactModalTitle').textContent = 'Add Contact';
    document.getElementById('contactForm').reset();
    document.getElementById('contactId').value = '';
    document.getElementById('emailValidation').textContent = '';
    
    const modal = new bootstrap.Modal(document.getElementById('contactModal'));
    modal.show();
}

// Edit Contact
async function editContact(contactId) {
    const contact = contactsState.contacts.find(c => c.id === contactId);
    if (!contact) return;
    
    document.getElementById('contactModalTitle').textContent = 'Edit Contact';
    document.getElementById('contactId').value = contact.id;
    document.getElementById('firstName').value = contact.first_name || '';
    document.getElementById('lastName').value = contact.last_name || '';
    document.getElementById('contactEmail').value = contact.email;
    document.getElementById('contactCompany').value = contact.company || '';
    document.getElementById('contactPhone').value = contact.phone || '';
    document.getElementById('contactTags').value = (contact.tags || []).join(', ');
    
    const modal = new bootstrap.Modal(document.getElementById('contactModal'));
    modal.show();
}

// Save Contact
async function saveContact() {
    const contactId = document.getElementById('contactId').value;
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('contactEmail').value.trim();
    const company = document.getElementById('contactCompany').value.trim();
    const phone = document.getElementById('contactPhone').value.trim();
    const tags = document.getElementById('contactTags').value.split(',').map(t => t.trim()).filter(t => t);
    
    // Validate email
    if (!email || !GBUtils.isValidEmail(email)) {
        showToast('Please enter a valid email address', 'error');
        return;
    }
    
    try {
        if (contactId) {
            // Update existing contact
            const { error } = await gbSupabase.update('contacts', {
                first_name: firstName,
                last_name: lastName,
                email,
                company,
                phone,
                tags,
                updated_at: new Date().toISOString()
            }, { id: contactId });
            
            if (error) throw error;
            showToast('Contact updated successfully!', 'success');
        } else {
            // Check for duplicates
            const { data: existing } = await gbSupabase.select('contacts', 'id', {
                filters: [
                    { column: 'email', operator: 'eq', value: email },
                    { column: 'user_id', operator: 'eq', value: gbApp.currentUser.id }
                ]
            });
            
            if (existing && existing.length > 0) {
                showToast('Contact with this email already exists!', 'error');
                return;
            }
            
            // Add new contact
            const { error } = await gbSupabase.insert('contacts', {
                user_id: gbApp.currentUser.id,
                first_name: firstName,
                last_name: lastName,
                email,
                company,
                phone,
                tags,
                status: 'active',
                subscribed: true,
                subscribed_at: new Date().toISOString()
            });
            
            if (error) throw error;
            showToast('Contact added successfully!', 'success');
        }
        
        // Close modal and reload
        bootstrap.Modal.getInstance(document.getElementById('contactModal')).hide();
        loadContacts();
        
    } catch (error) {
        showToast('Error saving contact: ' + error.message, 'error');
    }
}

// Delete Contact
async function deleteContact(contactId) {
    if (!confirm('Are you sure you want to delete this contact?')) return;
    
    try {
        const { error } = await gbSupabase.delete('contacts', { id: contactId });
        if (error) throw error;
        
        showToast('Contact deleted', 'success');
        loadContacts();
    } catch (error) {
        showToast('Error deleting contact: ' + error.message, 'error');
    }
}

// Search with debounce
const debounceSearch = GBUtils.debounce(() => {
    contactsState.searchQuery = document.getElementById('contactSearch').value.trim();
    loadContacts(1);
}, 300);

// Sort Contacts
function sortContacts(column) {
    if (contactsState.sortColumn === column) {
        contactsState.sortOrder = contactsState.sortOrder === 'asc' ? 'desc' : 'asc';
    } else {
        contactsState.sortColumn = column;
        contactsState.sortOrder = 'asc';
    }
    loadContacts(1);
}

// Toggle Select All
function toggleSelectAll() {
    const selectAll = document.getElementById('selectAll');
    const checkboxes = document.querySelectorAll('.contact-checkbox');
    
    checkboxes.forEach(checkbox => {
        checkbox.checked = selectAll.checked;
        if (selectAll.checked) {
            contactsState.selectedContacts.add(checkbox.value);
        } else {
            contactsState.selectedContacts.delete(checkbox.value);
        }
    });
    
    updateBulkActions();
}

// Toggle Contact Selection
function toggleContactSelection(contactId, isChecked) {
    if (isChecked) {
        contactsState.selectedContacts.add(contactId);
    } else {
        contactsState.selectedContacts.delete(contactId);
    }
    updateBulkActions();
}

// Update Bulk Actions Bar
function updateBulkActions() {
    const bulkActions = document.getElementById('bulkActions');
    const selectedCount = document.getElementById('selectedCount');
    
    if (contactsState.selectedContacts.size > 0) {
        bulkActions.classList.remove('d-none');
        selectedCount.textContent = contactsState.selectedContacts.size;
    } else {
        bulkActions.classList.add('d-none');
    }
}

// Bulk Delete
async function bulkDelete() {
    if (!confirm(`Delete ${contactsState.selectedContacts.size} contacts?`)) return;
    
    try {
        const { error } = await gbSupabase.delete('contacts', {
            id: contactsState.selectedContacts
        });
        
        if (error) throw error;
        
        contactsState.selectedContacts.clear();
        updateBulkActions();
        showToast('Contacts deleted', 'success');
        loadContacts();
    } catch (error) {
        showToast('Error deleting contacts: ' + error.message, 'error');
    }
}

// Bulk Add Tag
function bulkAddTag() {
    const modal = new bootstrap.Modal(document.getElementById('tagModal'));
    modal.show();
}

async function applyTag() {
    const tag = document.getElementById('newTag').value.trim();
    if (!tag) return;
    
    try {
        for (const contactId of contactsState.selectedContacts) {
            const contact = contactsState.contacts.find(c => c.id === contactId);
            const tags = [...(contact.tags || []), tag];
            
            await gbSupabase.update('contacts', { tags }, { id: contactId });
        }
        
        bootstrap.Modal.getInstance(document.getElementById('tagModal')).hide();
        showToast('Tag added successfully', 'success');
        loadContacts();
        loadTags();
    } catch (error) {
        showToast('Error adding tag: ' + error.message, 'error');
    }
}

// Bulk Add to List
function bulkAddToList() {
    const modal = new bootstrap.Modal(document.getElementById('listModal'));
    modal.show();
}

async function applyList() {
    const listId = document.getElementById('listSelect').value;
    if (!listId) {
        showToast('Please select a list', 'error');
        return;
    }
    
    try {
        const inserts = [];
        for (const contactId of contactsState.selectedContacts) {
            inserts.push({
                list_id: listId,
                contact_id: contactId
            });
        }
        
        const { error } = await gbSupabase.client
            .from('list_contacts')
            .insert(inserts);
        
        if (error) throw error;
        
        bootstrap.Modal.getInstance(document.getElementById('listModal')).hide();
        showToast('Contacts added to list', 'success');
    } catch (error) {
        showToast('Error adding to list: ' + error.message, 'error');
    }
}

// Load Tags
async function loadTags() {
    try {
        const { data, error } = await gbSupabase.client
            .from('contacts')
            .select('tags')
            .eq('user_id', gbApp.currentUser.id);
        
        if (error) throw error;
        
        const allTags = new Set();
        data.forEach(contact => {
            (contact.tags || []).forEach(tag => allTags.add(tag));
        });
        
        const tagFilter = document.getElementById('tagFilter');
        tagFilter.innerHTML = '<option value="">All Tags</option>' +
            Array.from(allTags).sort().map(tag => 
                `<option value="${tag}">${tag}</option>`
            ).join('');
        
    } catch (error) {
        console.error('Error loading tags:', error);
    }
}

// Load Lists
async function loadLists() {
    try {
        const { data, error } = await gbSupabase.client
            .from('lists')
            .select('id, name')
            .eq('user_id', gbApp.currentUser.id);
        
        if (error) throw error;
        
        const listSelect = document.getElementById('listSelect');
        const listFilter = document.getElementById('listFilter');
        
        const options = '<option value="">Select list...</option>' +
            (data || []).map(list => 
                `<option value="${list.id}">${list.name}</option>`
            ).join('');
        
        listSelect.innerHTML = options;
        listFilter.innerHTML = '<option value="">All Lists</option>' +
            (data || []).map(list => 
                `<option value="${list.id}">${list.name}</option>`

    } catch (error) {

}

function previewCSV() {
    const fileInput = document.getElementById('csvFile');
    const file = fileInput.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        const csvText = e.target.result;
        const csvData = parseCSVData(csvText);
        contactsState.csvData = csvData;
        
        if (csvData.length === 0) {
            showToast('No data found in CSV', 'error');
            return;
        }
        
        // Show preview
        document.getElementById('csvPreview').classList.remove('d-none');
        document.getElementById('csvRowCount').textContent = csvData.length;
        document.getElementById('importBtn').disabled = false;
        
        // Render preview table
        const headers = Object.keys(csvData[0]);
        const headersHtml = headers.map(h => `<th>${h}</th>`).join('');
        document.getElementById('csvHeaders').innerHTML = `<tr>${headersHtml}</tr>`;
        
        const rowsHtml = csvData.slice(0, 5).map(row => {
            return `<tr>${headers.map(h => `<td>${row[h] || ''}</td>`).join('')}</tr>`;
        }).join('');
        document.getElementById('csvRows').innerHTML = rowsHtml;
        
        // Create mapping
        createColumnMapping(headers);
    };

// Better CSV Parser
function parseCSVData(csvText) {
    const lines = csvText.split(/\r?\n/);
    if (lines.length < 2) return [];
    
    // Parse headers (first line)
    const headers = parseCSVLine(lines[0]);
    
    const result = [];
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        
        const values = parseCSVLine(lines[i]);
        const obj = {};
        
        headers.forEach((header, index) => {
            obj[header.trim()] = values[index] ? values[index].trim() : '';
        });
        
        // Only add if at least one value exists
        if (Object.values(obj).some(value => value !== '')) {
            result.push(obj);
        }
    }
    
    return result;
}

// Parse single CSV line (handles quoted values)
function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        
        if (char === '"') {
            inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
            result.push(current);
            current = '';
        } else {
            current += char;
        }
    }
    
    result.push(current);
    return result;
}
function createColumnMapping(headers) {
    const mappingDiv = document.getElementById('columnMapping');
    
    const fields = [
        { key: 'email', label: 'Email *', required: true },
        { key: 'first_name', label: 'First Name' },
        { key: 'last_name', label: 'Last Name' },
        { key: 'company', label: 'Company' },
        { key: 'phone', label: 'Phone' }
    ];
    
    mappingDiv.innerHTML = fields.map(field => {
        // Auto-detect best match
        let selectedHeader = '';
        const fieldLower = field.key.toLowerCase();
        
        // Try exact match first
        selectedHeader = headers.find(h => 
            h.toLowerCase().replace(/[^a-z]/g, '') === fieldLower.replace('_', '')
        ) || '';
        
        // Try partial match
        if (!selectedHeader) {
            selectedHeader = headers.find(h => 
                h.toLowerCase().includes(fieldLower.split('_')[0])
            ) || '';
        }
        
        // Special case for email
        if (field.key === 'email' && !selectedHeader) {
            selectedHeader = headers.find(h => 
                h.toLowerCase().includes('email') || h.toLowerCase().includes('e-mail')
            ) || '';
        }
        
        return `
            <div class="col-md-6 mb-2">
                <label class="form-label">${field.label}</label>
                <select class="form-select csv-mapping" data-field="${field.key}">
                    <option value="">-- Select Column --</option>
                    ${headers.map(header => 
                        `<option value="${header}" ${header === selectedHeader ? 'selected' : ''}>${header}</option>`
                    ).join('')}
                </select>
            </div>
        `;
    }).join('');
}
async function importContacts() {
    // Get mapping from selects
    const mapping = {};
    document.querySelectorAll('.csv-mapping').forEach(select => {
        if (select.value) {
            mapping[select.dataset.field] = select.value;
        }
    });
    
    if (!mapping.email) {
        showToast('Please map the email column', 'error');
        return;
    }
    
    const skipDuplicates = document.getElementById('skipDuplicates').checked;
    let imported = 0;
    let skipped = 0;
    let errors = [];
    
    try {
        for (const row of contactsState.csvData) {
            const email = row[mapping.email] || '';
            
            // Validate email
            if (!email || !GBUtils.isValidEmail(email)) {
                skipped++;
                errors.push(`Invalid email: ${email}`);
                continue;
            }
            
            // Check for duplicates
            const { data: existing } = await gbSupabase.client
                .from('contacts')
                .select('id')
                .eq('email', email)
                .eq('user_id', gbApp.currentUser.id);
            
            if (existing && existing.length > 0) {
                if (skipDuplicates) {
                    skipped++;
                    errors.push(`Duplicate: ${email}`);
                    continue;
                }
            }
            
            // Prepare contact data
            const contactData = {
                user_id: gbApp.currentUser.id,
                email: email,
                first_name: mapping.first_name ? (row[mapping.first_name] || '') : '',
                last_name: mapping.last_name ? (row[mapping.last_name] || '') : '',
                company: mapping.company ? (row[mapping.company] || '') : '',
                phone: mapping.phone ? (row[mapping.phone] || '') : '',
                status: 'active',
                subscribed: true,
                subscribed_at: new Date().toISOString(),
                created_at: new Date().toISOString(),
                updated_at: new Date().toISOString()
            };
            
            // Insert contact
            const { error } = await gbSupabase.insert('contacts', contactData);
            
            if (!error) {
                imported++;
                console.log('Imported:', email);
            } else {
                skipped++;
                errors.push(`Error for ${email}: ${error.message}`);
                console.error('Import error:', error);
            }
        }
        
        // Close modal
        bootstrap.Modal.getInstance(document.getElementById('importModal')).hide();
        
        // Show summary
        if (errors.length > 0) {
            console.log('Import errors:', errors);
            showToast(`Import complete: ${imported} added, ${skipped} skipped. Check console for details.`, imported > 0 ? 'success' : 'warning');
        } else {
            showToast(`Import successful: ${imported} contacts added!`, 'success');
        }
        
        // Reload contacts
        loadContacts();
        loadTags();
        
    } catch (error) {
        console.error('Import error:', error);
        showToast('Error importing contacts: ' + error.message, 'error');
    }
}

    
// Export Contacts
async function exportContacts() {
    try {
        const { data, error } = await gbSupabase.client
            .from('contacts')
            .select('*')
            .eq('user_id', gbApp.currentUser.id);
        
        if (error) throw error;
        
        const exportData = data.map(contact => ({
            FirstName: contact.first_name || '',
            LastName: contact.last_name || '',
            Email: contact.email,
            Company: contact.company || '',
            Phone: contact.phone || '',
            Tags: (contact.tags || []).join(';'),
            Status: contact.status,
            CreatedAt: GBUtils.formatDate(contact.created_at, 'datetime')
        }));
        
        GBUtils.exportToCSV(exportData, `gb-mailer-contacts-${new Date().toISOString().split('T')[0]}.csv`);
        showToast('Contacts exported successfully!', 'success');
        
    } catch (error) {
        showToast('Error exporting contacts: ' + error.message, 'error');
    }
}

function getInitials(firstName, lastName, email) {
    if (firstName && lastName) {
        return (firstName[0] + lastName[0]).toUpperCase();
    } else if (firstName) {
        return firstName[0].toUpperCase();
    } else {
        return email[0].toUpperCase();
    }
}

function getAvatarColor(email) {
    const colors = ['#e94560', '#0f3460', '#533483', '#00b4d8', '#fb8500', '#219ebc'];
    const index = email.charCodeAt(0) % colors.length;
    return colors[index];
}
