<div class="module-container">
    <div class="module-header">
        <h2 class="module-title">Contacts</h2>
        <div>
            <button class="btn btn-outline-primary me-2" onclick="showImportModal()">
                <i class="bi bi-upload"></i> Import CSV
            </button>
            <button class="btn btn-primary" onclick="showAddContactModal()">
                <i class="bi bi-person-plus"></i> Add Contact
            </button>
        </div>
    </div>
    
    <!-- Search and Filters -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <input type="text" class="form-control" placeholder="Search contacts by name or email..." id="contactSearch">
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="tagFilter">
                        <option value="">All Tags</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="listFilter">
                        <option value="">All Lists</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Contacts Table -->
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAllContacts"></th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Company</th>
                            <th>Tags</th>
                            <th>Score</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted py-4">
                                <i class="bi bi-people" style="font-size: 3rem;"></i>
                                <p class="mt-2 mb-0">No contacts yet. Add your first contact!</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
