<div class="module-container">
    <div class="module-header">
        <div>
            <h2 class="module-title">Contacts</h2>
            <p class="text-muted mb-0" id="contactCount">0 contacts</p>
        </div>
        <div>
            <button class="btn learn-btn me-2" onclick="showContactsGuide()">
                <i class="bi bi-book"></i> Learn
            </button>
            <label class="btn btn-outline-primary me-2" style="cursor: pointer;">
                <i class="bi bi-upload"></i> Upload File
                <input type="file" id="importFile" accept=".xlsx,.xls,.csv" 
                       style="display: none;" onchange="previewImportFile()">
            </label>
            <button class="btn btn-outline-success me-2" onclick="exportContacts()">
                <i class="bi bi-download"></i> Export
            </button>
            <button class="btn btn-primary" onclick="showAddContactModal()">
                <i class="bi bi-person-plus"></i> Add Contact
            </button>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" placeholder="Search contacts..." id="contactSearch" onkeyup="debounceSearch()">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="tagFilter" onchange="loadContacts()">
                        <option value="">All Tags</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="listFilter" onchange="loadContacts()">
                        <option value="">All Lists</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" id="statusFilter" onchange="loadContacts()">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="unsubscribed">Unsubscribed</option>
                        <option value="bounced">Bounced</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="bulkActions" class="alert alert-primary d-none">
        <div class="d-flex justify-content-between align-items-center">
            <span><strong id="selectedCount">0</strong> selected</span>
            <div>
                <button class="btn btn-sm btn-outline-primary me-1" onclick="bulkAddTag()">Add Tag</button>
                <button class="btn btn-sm btn-outline-success me-1" onclick="bulkAddToList()">Add to List</button>
                <button class="btn btn-sm btn-outline-danger" onclick="bulkDelete()">Delete</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th width="40"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Company</th>
                            <th>Tags</th>
                            <th>Status</th>
                            <th>Added</th>
                            <th width="100">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody">
                        <tr><td colspan="8" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <div>
            <select class="form-select form-select-sm" id="pageSize" onchange="changePageSize()" style="width: auto; display: inline-block;">
                <option value="10">10</option>
                <option value="25" selected>25</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>
        <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
    </div>
</div>

<!-- Import Preview Modal -->
<div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Import Preview</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info">
                    <strong id="importRowCount">0</strong> contacts found
                </div>
                <div class="table-responsive mb-3" style="max-height: 200px; overflow-y: auto;">
                    <table class="table table-sm table-bordered">
                        <thead id="importHeaders"></thead>
                        <tbody id="importRows"></tbody>
                    </table>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Email Column *</label>
                        <select class="form-select" id="emailColumn">
                            <option value="">Select...</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Name Column</label>
                        <select class="form-select" id="nameColumn">
                            <option value="">Select...</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="importContacts()">
                    <i class="bi bi-upload"></i> Import Now
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Add Contact Modal -->
<div class="modal fade" id="contactModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="contactModalTitle">Add Contact</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="contactId">
                <div class="mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email" class="form-control" id="contactEmail">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Company</label>
                    <input type="text" class="form-control" id="contactCompany">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="saveContact()">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
let contactsState = {
    contacts: [],
    selectedContacts: new Set(),
    currentPage: 1,
    pageSize: 25,
    totalPages: 1,
    searchQuery: '',
    importData: [],
    importHeaders: []
};

function initContactsModule() {
    loadContacts();
}

async function loadContacts(page = 1) {
    contactsState.currentPage = page;
    try {
        const start = (page - 1) * contactsState.pageSize;
        const end = start + contactsState.pageSize - 1;
        
        const { data, error, count } = await gbSupabase.client
            .from('contacts')
            .select('*', { count: 'exact' })
            .eq('user_id', gbApp.currentUser.id)
            .order('created_at', { ascending: false })
            .range(start, end);
        
        if (error) { console.error(error); return; }
        
        contactsState.contacts = data || [];
        contactsState.totalPages = Math.ceil((count || 0) / contactsState.pageSize);
        document.getElementById('contactCount').textContent = `${count || 0} contacts`;
        renderContactsTable();
        renderPagination();
    } catch (error) {
        console.error('Error:', error);
    }
}

function renderContactsTable() {
    const tbody = document.getElementById('contactsTableBody');
    if (contactsState.contacts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5">No contacts yet. Upload your file!</td></tr>';
        return;
    }
    
    tbody.innerHTML = contactsState.contacts.map(c => `
        <tr>
            <td><input type="checkbox" class="contact-checkbox" value="${c.id}" onchange="toggleContactSelection('${c.id}', this.checked)"></td>
            <td>${c.first_name || ''} ${c.last_name || ''}</td>
            <td>${c.email}</td>
            <td>${c.company || '-'}</td>
            <td>${(c.tags || []).join(', ')}</td>
            <td><span class="badge bg-success">${c.status || 'active'}</span></td>
            <td>${GBUtils.formatDate(c.created_at, 'short')}</td>
            <td>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteContact('${c.id}')">🗑</button>
            </td>
        </tr>
    `).join('');
}

function renderPagination() {
    const pagination = document.getElementById('pagination');
    if (contactsState.totalPages <= 1) { pagination.innerHTML = ''; return; }
    
    let html = '';
    for (let i = 1; i <= contactsState.totalPages; i++) {
        html += `<li class="page-item ${i === contactsState.currentPage ? 'active' : ''}">
            <a class="page-link" href="#" onclick="loadContacts(${i})">${i}</a>
        </li>`;
    }
    pagination.innerHTML = html;
}

function previewImportFile() {
    const fileInput = document.getElementById('importFile');
    const file = fileInput.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            let data = [];
            const fileName = file.name.toLowerCase();
            
            if (fileName.endsWith('.csv')) {
                const text = e.target.result;
                const lines = text.split('\n');
                const headers = lines[0].split(',').map(h => h.trim());
                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    const values = lines[i].split(',');
                    const row = {};
                    headers.forEach((h, idx) => { row[h] = values[idx]?.trim() || ''; });
                    data.push(row);
                }
            } else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                if (typeof XLSX === 'undefined') {
                    showToast('XLSX library not loaded. Use CSV instead.', 'error');
                    return;
                }
                const workbook = XLSX.read(e.target.result, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                data = XLSX.utils.sheet_to_json(firstSheet);
            }
            
            if (data.length === 0) { showToast('No data found', 'error'); return; }
            
            contactsState.importData = data;
            contactsState.importHeaders = Object.keys(data[0]);
            
            document.getElementById('importRowCount').textContent = data.length;
            
            const emailSelect = document.getElementById('emailColumn');
            const nameSelect = document.getElementById('nameColumn');
            let emailOpts = '<option value="">Select...</option>';
            let nameOpts = '<option value="">Select...</option>';
            
            contactsState.importHeaders.forEach(h => {
                const lower = h.toLowerCase();
                const isEmail = lower.includes('email') || lower.includes('mail');
                const isName = lower.includes('name');
                emailOpts += `<option value="${h}" ${isEmail ? 'selected' : ''}>${h}</option>`;
                nameOpts += `<option value="${h}" ${isName ? 'selected' : ''}>${h}</option>`;
            });
            
            emailSelect.innerHTML = emailOpts;
            nameSelect.innerHTML = nameOpts;
            
            document.getElementById('importHeaders').innerHTML = 
                '<tr>' + contactsState.importHeaders.map(h => `<th>${h}</th>`).join('') + '</tr>';
            
            document.getElementById('importRows').innerHTML = 
                data.slice(0, 5).map(row => 
                    '<tr>' + contactsState.importHeaders.map(h => `<td>${row[h] || ''}</td>`).join('') + '</tr>'
                ).join('');
            
            new bootstrap.Modal(document.getElementById('importModal')).show();
            
        } catch (error) {
            console.error('Error:', error);
            showToast('Error reading file', 'error');
        }
    };
    
    if (file.name.toLowerCase().endsWith('.csv')) {
        reader.readAsText(file);
    } else {
        reader.readAsArrayBuffer(file);
    }
}

async function importContacts() {
    const emailCol = document.getElementById('emailColumn').value;
    const nameCol = document.getElementById('nameColumn').value;
    
    if (!emailCol) { showToast('Select email column', 'error'); return; }
    
    let added = 0;
    for (const row of contactsState.importData) {
        const email = String(row[emailCol] || '').trim().toLowerCase();
        if (!email || !email.includes('@')) continue;
        
        const { data: existing } = await gbSupabase.client
            .from('contacts').select('id')
            .eq('email', email).eq('user_id', gbApp.currentUser.id);
        
        if (existing && existing.length > 0) continue;
        
        let firstName = '', lastName = '';
        if (nameCol && row[nameCol]) {
            const parts = String(row[nameCol]).trim().split(/\s+/);
            firstName = parts[0] || '';
            lastName = parts.slice(1).join(' ') || '';
        }
        
        const { error } = await gbSupabase.client.from('contacts').insert({
            user_id: gbApp.currentUser.id,
            email, first_name: firstName, last_name: lastName,
            status: 'active', subscribed: true
        });
        
        if (!error) added++;
    }
    
    bootstrap.Modal.getInstance(document.getElementById('importModal')).hide();
    showToast(`${added} contacts imported!`, 'success');
    loadContacts();
}

async function saveContact() {
    const email = document.getElementById('contactEmail').value.trim();
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const company = document.getElementById('contactCompany').value.trim();
    
    if (!email) { showToast('Enter email', 'error'); return; }
    
    await gbSupabase.insert('contacts', {
        user_id: gbApp.currentUser.id,
        email, first_name: firstName, last_name: lastName,
        company, status: 'active', subscribed: true
    });
    
    bootstrap.Modal.getInstance(document.getElementById('contactModal')).hide();
    showToast('Contact added!', 'success');
    loadContacts();
}

async function deleteContact(id) {
    if (!confirm('Delete?')) return;
    await gbSupabase.delete('contacts', { id });
    loadContacts();
}

function showAddContactModal() {
    new bootstrap.Modal(document.getElementById('contactModal')).show();
}

function showContactsGuide() {
    showToast('Import contacts using XLSX or CSV file', 'info');
}

function debounceSearch() {
    clearTimeout(window.searchTimeout);
    window.searchTimeout = setTimeout(() => {
        contactsState.searchQuery = document.getElementById('contactSearch').value.trim();
        loadContacts(1);
    }, 300);
}

function toggleSelectAll() {
    const checked = document.getElementById('selectAll').checked;
    document.querySelectorAll('.contact-checkbox').forEach(cb => {
        cb.checked = checked;
        if (checked) contactsState.selectedContacts.add(cb.value);
        else contactsState.selectedContacts.delete(cb.value);
    });
    updateBulkActions();
}

function toggleContactSelection(id, checked) {
    if (checked) contactsState.selectedContacts.add(id);
    else contactsState.selectedContacts.delete(id);
    updateBulkActions();
}

function updateBulkActions() {
    const bulk = document.getElementById('bulkActions');
    document.getElementById('selectedCount').textContent = contactsState.selectedContacts.size;
    bulk.classList.toggle('d-none', contactsState.selectedContacts.size === 0);
}

async function bulkDelete() {
    if (!confirm('Delete selected?')) return;
    for (const id of contactsState.selectedContacts) {
        await gbSupabase.delete('contacts', { id });
    }
    contactsState.selectedContacts.clear();
    loadContacts();
}

function bulkAddTag() { showToast('Tag feature coming', 'info'); }
function bulkAddToList() { showToast('List feature coming', 'info'); }

async function exportContacts() {
    const { data } = await gbSupabase.client
        .from('contacts').select('*').eq('user_id', gbApp.currentUser.id);
    
    const exportData = (data || []).map(c => ({
        'First Name': c.first_name || '',
        'Last Name': c.last_name || '',
        'Email': c.email,
        'Company': c.company || ''
    }));
    
    GBUtils.exportToCSV(exportData, 'contacts.csv');
}

function changePageSize() {
    contactsState.pageSize = parseInt(document.getElementById('pageSize').value);
    loadContacts(1);
}
</script>
