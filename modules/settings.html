<div class="module-container">
    <div class="module-header">
        <h2 class="module-title">Settings</h2>
    </div>
    
    <div class="row">
        <div class="col-md-8">
            <div class="card mb-3">
                <div class="card-header">
                    <h5 class="mb-0">SMTP Configuration</h5>
                </div>
                <div class="card-body">
                    <p class="text-muted">Configure your SMTP settings for sending emails. Currently supporting AWS SES and other SMTP providers.</p>
                    
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i>
                        SMTP setup will be available in the next phase.
                    </div>
                    
                    <form id="smtpForm">
                        <div class="mb-3">
                            <label class="form-label">SMTP Host</label>
                            <input type="text" class="form-control" placeholder="email-smtp.us-east-1.amazonaws.com" disabled>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Port</label>
                                <input type="number" class="form-control" placeholder="587" disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Encryption</label>
                                <select class="form-select" disabled>
                                    <option>TLS</option>
                                    <option>SSL</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" disabled>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">Account Info</h5>
                </div>
                <div class="card-body">
                    <p><strong>Plan:</strong> Free Trial</p>
                    <p><strong>Contacts:</strong> 0 / 500</p>
                    <p><strong>Emails Sent:</strong> 0 / 5000</p>
                    <hr>
                    <button class="btn btn-outline-primary w-100 mb-2">
                        <i class="bi bi-credit-card"></i> Upgrade Plan
                    </button>
                    <button class="btn btn-outline-danger w-100" onclick="handleLogout()">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
