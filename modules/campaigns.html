<div class="module-container">
    <div class="module-header">
        <h2 class="module-title">Campaigns</h2>
        <button class="btn btn-primary" onclick="showCreateCampaignModal()">
            <i class="bi bi-send"></i> New Campaign
        </button>
    </div>
    
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Campaign Name</th>
                            <th>Status</th>
                            <th>Recipients</th>
                            <th>Opens</th>
                            <th>Clicks</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="campaignsTableBody">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-send" style="font-size: 3rem;"></i>
                                <p class="mt-2 mb-0">No campaigns yet. Create your first campaign.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
