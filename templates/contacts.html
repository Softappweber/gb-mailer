<!DOCTYPE html>
<html>
<head>
    <title>Contacts - GB Mailer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-address-book"></i> Contacts</h1>
            <div class="header-actions">
                <button onclick="showUploadModal()" class="btn btn-primary">
                    <i class="fas fa-upload"></i> Upload Contacts
                </button>
                <button onclick="sendSelected()" class="btn btn-success" id="sendSelectedBtn">
                    <i class="fas fa-envelope"></i> Send Selected (<span id="selectedCount">0</span>)
                </button>
                <button onclick="loadContacts()" class="btn btn-secondary">
                    <i class="fas fa-refresh"></i> Refresh
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search contacts..." onkeyup="loadContacts()">
        </div>

        <!-- Contacts Table -->
        <div class="table-container">
            <table id="contactsTable">
                <thead>
                    <tr>
                        <th style="width:40px;"><input type="checkbox" id="selectAll" onchange="toggleAll()"></th>
                        <th style="width:50px;">#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Company</th>
                        <th>Position</th>
                        <th style="width:150px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="contactsBody">
                    <!-- Loaded dynamically via JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
    </div>

    <!-- ============================================ -->
    <!-- UPLOAD MODAL -->
    <!-- ============================================ -->
    <div id="uploadModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeModal('uploadModal')">&times;</span>
            <h2><i class="fas fa-upload"></i> Upload Contacts</h2>
            
            <!-- Step 1: Select File -->
            <div id="step1">
                <div class="upload-area">
                    <p><i class="fas fa-file-excel" style="font-size:48px;color:#217346;"></i></p>
                    <p><strong>Upload Excel or CSV file</strong></p>
                    <p style="color:#6c757d;font-size:14px;">Supports .xlsx, .xls, .csv</p>
                    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="margin:15px auto;display:block;">
                    <button onclick="previewFile()" class="btn btn-primary">
                        <i class="fas fa-eye"></i> Preview Columns
                    </button>
                </div>
            </div>
            
            <!-- Step 2: Column Mapping -->
            <div id="step2" style="display:none;">
                <h3>Map Your Columns</h3>
                <p>Select <strong>5-6 columns</strong> to display. All other columns will be stored as custom fields.</p>
                <div id="columnMapping"></div>
                <div class="mapping-actions" style="margin-top:20px;">
                    <button onclick="confirmMapping()" class="btn btn-success">
                        <i class="fas fa-check"></i> Confirm & Import
                    </button>
                    <button onclick="goBack()" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Back
                    </button>
                </div>
            </div>
            
            <!-- Step 3: Import Progress -->
            <div id="step3" style="display:none;">
                <h3>Importing...</h3>
                <div class="progress-bar">
                    <div id="progressBar" style="width:0%;"></div>
                </div>
                <p id="importStatus">Processing...</p>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- EMAIL COMPOSER MODAL -->
    <!-- ============================================ -->
    <div id="emailModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeModal('emailModal')">&times;</span>
            <h2><i class="fas fa-paper-plane"></i> Send Email</h2>
            <p>Sending to <strong><span id="recipientCount">0</span></strong> contacts</p>
            
            <form id="emailForm">
                <input type="hidden" id="contactIds" value="[]">
                
                <div class="form-group">
                    <label>Subject *</label>
                    <input type="text" id="emailSubject" placeholder="Email subject..." required>
                </div>
                
                <div class="form-group">
                    <label>Body * <small>(Use {{name}}, {{company}}, etc. for personalization)</small></label>
                    <textarea id="emailBody" rows="8" placeholder="Write your email..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label>Attachments</label>
                    <input type="file" id="attachmentInput" multiple>
                    <div id="attachmentList" style="margin-top:10px;"></div>
                </div>
                
                <div class="form-group">
                    <label>Save as Template (optional)</label>
                    <input type="text" id="templateName" placeholder="Template name...">
                </div>
                
                <div class="form-actions">
                    <button type="button" onclick="sendEmails()" class="btn btn-success">
                        <i class="fas fa-paper-plane"></i> Send Now
                    </button>
                    <button type="button" onclick="closeModal('emailModal')" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================ -->
    <script src="{{ url_for('static', filename='js/contacts.js') }}"></script>
    <script>
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadContacts();
        });
    </script>
</body>
</html>
