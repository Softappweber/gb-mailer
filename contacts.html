<div class="module-container">
    <!-- Header -->
    <div class="module-header">
        <div>
            <h2 class="module-title">Contacts</h2>
            <p class="text-muted mb-0" id="contactCount">0 contacts</p>
        </div>
        <div>
            <button class="btn btn-outline-success me-2" onclick="showImportModal()">
                <i class="bi bi-upload"></i> Import
            </button>
            <button class="btn btn-primary" onclick="showAddContactModal()">
                <i class="bi bi-person-plus"></i> Add Contact
            </button>
        </div>
    </div>

    <!-- Search and Filter -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-4 mb-2">
                    <input type="text" class="form-control" id="contactSearch" placeholder="Search contacts..." oninput="searchContacts()">
                </div>
                <div class="col-md-3 mb-2">
                    <select class="form-select" id="contactStatusFilter" onchange="searchContacts()">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="unsubscribed">Unsubscribed</option>
                        <option value="bounced">Bounced</option>
                    </select>
                </div>
                <div class="col-md-2 mb-2">
                    <select class="form-select" id="pageSizeSelect" onchange="changePageSize(this.value)">
                        <option value="10">10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <div class="col-md-3 mb-2">
                    <button class="btn btn-outline-danger" onclick="showBulkEmailModal()">
                        <i class="bi bi-envelope"></i> Send Email
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Contacts Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th style="width: 40px;">
                                <input type="checkbox" id="selectAllContacts" onchange="toggleSelectAll()">
                            </th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Company</th>
                            <th>Phone</th>
                            <th>Status</th>
                            <th style="width: 100px;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Pagination -->
        <div class="card-footer bg-white">
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted" id="paginationInfo">Loading...</small>
                <nav>
                    <ul class="pagination pagination-sm mb-0" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Contact Modal -->
<div class="modal fade" id="contactModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="contactModalTitle">Add Contact</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="contactId">
                
                <div class="mb-3">
                    <label class="form-label">First Name *</label>
                    <input type="text" class="form-control" id="firstName" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Email Address *</label>
                    <input type="email" class="form-control" id="contactEmail" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="contactPhone">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Company</label>
                    <input type="text" class="form-control" id="contactCompany">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="contactStatus">
                        <option value="active">Active</option>
                        <option value="unsubscribed">Unsubscribed</option>
                        <option value="bounced">Bounced</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveContact()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Import Modal -->
<div class="modal fade" id="importModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Import Contacts</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Upload CSV or Excel File</label>
                    <input type="file" class="form-control" id="importFile" accept=".csv,.xlsx,.xls" onchange="handleFileSelect(event)">
                </div>
                
                <div id="columnMapping" class="d-none">
                    <h6 class="mb-3">Map Columns</h6>
                    <div class="row" id="columnMappingFields"></div>
                </div>
                
                <div id="importPreview" class="d-none">
                    <h6 class="mb-3">Preview (First 5 rows)</h6>
                    <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                        <table class="table table-sm" id="importPreviewTable"></table>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="importBtn" onclick="importContacts()" disabled>Import</button>
            </div>
        </div>
    </div>
</div>

<!-- Send Email Modal -->
<div class="modal fade" id="sendEmailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Send Email</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info">
                    Sending to <strong id="sendEmailCount">0</strong> contacts
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Subject *</label>
                    <input type="text" class="form-control" id="bulkEmailSubject">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Message *</label>
                    <textarea class="form-control" id="bulkEmailContent" rows="10"></textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Insert Variable</label>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-sm btn-light" onclick="insertBulkVariable('{{first_name}}')">{{first_name}}</button>
                        <button type="button" class="btn btn-sm btn-light" onclick="insertBulkVariable('{{last_name}}')">{{last_name}}</button>
                        <button type="button" class="btn btn-sm btn-light" onclick="insertBulkVariable('{{email}}')">{{email}}</button>
                        <button type="button" class="btn btn-sm btn-light" onclick="insertBulkVariable('{{company}}')">{{company}}</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="sendBulkEmail()">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
let contactsState = {
    allContacts: [],
    filteredContacts: [],
    selectedContacts: new Set(),
    currentPage: 1,
    pageSize: 10,
    totalPages: 1,
    importData: [],
    importColumns: []
};

function initContactsModule() {
    loadContacts();
}

async function loadContacts() {
    try {
        const { data, error } = await gbSupabase.client
            .from('contacts')
            .select('*')
            .eq('user_id', gbApp.currentUser.id)
            .order('created_at', { ascending: false });
        
        if (error) throw error;
        
        contactsState.allContacts = data || [];
        contactsState.filteredContacts = contactsState.allContacts;
        document.getElementById('contactCount').textContent = `${contactsState.allContacts.length} contacts`;
        
        applyFilters();
        
    } catch (error) {
        console.error('Error:', error);
        showToast('Error loading contacts', 'error');
    }
}

function searchContacts() {
    applyFilters();
}

function applyFilters() {
    const search = document.getElementById('contactSearch').value.toLowerCase();
    const statusFilter = document.getElementById('contactStatusFilter').value;
    
    contactsState.filteredContacts = contactsState.allContacts.filter(contact => {
        const matchesSearch = 
            (contact.first_name || '').toLowerCase().includes(search) ||
            (contact.last_name || '').toLowerCase().includes(search) ||
            (contact.email || '').toLowerCase().includes(search) ||
            (contact.company || '').toLowerCase().includes(search);
        
        const matchesStatus = statusFilter === 'all' || contact.status === statusFilter;
        
        return matchesSearch && matchesStatus;
    });
    
    contactsState.currentPage = 1;
    renderContacts();
}

function changePageSize(size) {
    contactsState.pageSize = parseInt(size);
    contactsState.currentPage = 1;
    renderContacts();
}

function renderContacts() {
    const tbody = document.getElementById('contactsTableBody');
    const contacts = contactsState.filteredContacts;
    
    if (contacts.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="text-center py-5">
                    <i class="bi bi-people" style="font-size: 3rem; color: #ccc;"></i>
                    <h5 class="mt-3">No Contacts</h5>
                    <p class="text-muted">Add or import contacts to get started</p>
                </td>
            </tr>
        `;
        document.getElementById('paginationInfo').textContent = 'No contacts';
        document.getElementById('pagination').innerHTML = '';
        return;
    }
    
    contactsState.totalPages = Math.ceil(contacts.length / contactsState.pageSize);
    
    if (contactsState.currentPage > contactsState.totalPages) {
        contactsState.currentPage = contactsState.totalPages;
    }
    
    const startIndex = (contactsState.currentPage - 1) * contactsState.pageSize;
    const endIndex = Math.min(startIndex + contactsState.pageSize, contacts.length);
    const pageContacts = contacts.slice(startIndex, endIndex);
    
    tbody.innerHTML = pageContacts.map(contact => {
        const statusBadge = contact.status === 'active' ? 'success' : contact.status === 'bounced' ? 'warning' : 'danger';
        return `
            <tr>
                <td>
                    <input type="checkbox" class="contact-checkbox" value="${contact.id}" 
                           ${contactsState.selectedContacts.has(contact.id) ? 'checked' : ''}
                           onchange="toggleContactSelection('${contact.id}', this.checked)">
                </td>
                <td><strong>${contact.first_name || ''} ${contact.last_name || ''}</strong></td>
                <td>${contact.email || '-'}</td>
                <td>${contact.company || '-'}</td>
                <td>${contact.phone || '-'}</td>
                <td><span class="badge bg-${statusBadge}">${contact.status || 'active'}</span></td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editContact('${contact.id}')">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteContact('${contact.id}')">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    }).join('');
    
    document.getElementById('paginationInfo').textContent = 
        `Showing ${startIndex + 1}-${endIndex} of ${contacts.length}`;
    
    renderPagination();
}

function renderPagination() {
    const pagination = document.getElementById('pagination');
    const totalPages = contactsState.totalPages;
    const currentPage = contactsState.currentPage;
    
    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }
    
    let html = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
        <a class="page-link" onclick="goToPage(${currentPage - 1})">&laquo;</a></li>`;
    
    for (let i = 1; i <= totalPages; i++) {
        html += `<li class="page-item ${currentPage === i ? 'active' : ''}">
            <a class="page-link" onclick="goToPage(${i})">${i}</a></li>`;
    }
    
    html += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
        <a class="page-link" onclick="goToPage(${currentPage + 1})">&raquo;</a></li>`;
    
    pagination.innerHTML = html;
}

function goToPage(page) {
    if (page < 1 || page > contactsState.totalPages) return;
    contactsState.currentPage = page;
    renderContacts();
}

function toggleSelectAll() {
    const selectAll = document.getElementById('selectAllContacts');
    const checkboxes = document.querySelectorAll('.contact-checkbox');
    
    checkboxes.forEach(checkbox => {
        checkbox.checked = selectAll.checked;
        if (selectAll.checked) {
            contactsState.selectedContacts.add(checkbox.value);
        } else {
            contactsState.selectedContacts.delete(checkbox.value);
        }
    });
}

function toggleContactSelection(contactId, isSelected) {
    if (isSelected) {
        contactsState.selectedContacts.add(contactId);
    } else {
        contactsState.selectedContacts.delete(contactId);
    }
}

function showAddContactModal() {
    document.getElementById('contactModalTitle').textContent = 'Add Contact';
    document.getElementById('contactId').value = '';
    document.getElementById('firstName').value = '';
    document.getElementById('lastName').value = '';
    document.getElementById('contactEmail').value = '';
    document.getElementById('contactPhone').value = '';
    document.getElementById('contactCompany').value = '';
    document.getElementById('contactStatus').value = 'active';
    
    new bootstrap.Modal(document.getElementById('contactModal')).show();
}

function editContact(contactId) {
    const contact = contactsState.allContacts.find(c => c.id === contactId);
    if (!contact) return;
    
    document.getElementById('contactModalTitle').textContent = 'Edit Contact';
    document.getElementById('contactId').value = contact.id;
    document.getElementById('firstName').value = contact.first_name || '';
    document.getElementById('lastName').value = contact.last_name || '';
    document.getElementById('contactEmail').value = contact.email || '';
    document.getElementById('contactPhone').value = contact.phone || '';
    document.getElementById('contactCompany').value = contact.company || '';
    document.getElementById('contactStatus').value = contact.status || 'active';
    
    new bootstrap.Modal(document.getElementById('contactModal')).show();
}

async function saveContact() {
    const contactId = document.getElementById('contactId').value;
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('contactEmail').value.trim();
    const phone = document.getElementById('contactPhone').value.trim();
    const company = document.getElementById('contactCompany').value.trim();
    const status = document.getElementById('contactStatus').value;
    
    if (!firstName || !email) {
        showToast('First name and email required', 'error');
        return;
    }
    
    try {
        const contactData = {
            first_name: firstName,
            last_name: lastName,
            email: email.toLowerCase(),
            phone: phone,
            company: company,
            status: status
        };
        
        if (contactId) {
            const { error } = await gbSupabase.update('contacts', contactData, { id: contactId });
            if (error) throw error;
            showToast('Contact updated!', 'success');
        } else {
            const { error } = await gbSupabase.insert('contacts', {
                ...contactData,
                user_id: gbApp.currentUser.id
            });
            if (error) throw error;
            showToast('Contact added!', 'success');
        }
        
        bootstrap.Modal.getInstance(document.getElementById('contactModal')).hide();
        loadContacts();
        
    } catch (error) {
        showToast('Error: ' + error.message, 'error');
    }
}

async function deleteContact(contactId) {
    if (!confirm('Delete this contact?')) return;
    
    try {
        const { error } = await gbSupabase.delete('contacts', { id: contactId });
        if (error) throw error;
        showToast('Contact deleted', 'success');
        loadContacts();
    } catch (error) {
        showToast('Error: ' + error.message, 'error');
    }
}

function showImportModal() {
    document.getElementById('importFile').value = '';
    document.getElementById('columnMapping').classList.add('d-none');
    document.getElementById('importPreview').classList.add('d-none');
    document.getElementById('importBtn').disabled = true;
    
    new bootstrap.Modal(document.getElementById('importModal')).show();
}

function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
            
            if (jsonData.length === 0) {
                showToast('No data found', 'error');
                return;
            }
            
            contactsState.importData = jsonData;
            contactsState.importColumns = Object.keys(jsonData[0]);
            
            showColumnMapping();
            
        } catch (error) {
            showToast('Error: ' + error.message, 'error');
        }
    };
    reader.readAsArrayBuffer(file);
}

function showColumnMapping() {
    const mappingDiv = document.getElementById('columnMapping');
    const fieldsDiv = document.getElementById('columnMappingFields');
    
    const fields = [
        { field: 'first_name', label: 'First Name', required: true },
        { field: 'email', label: 'Email', required: true },
        { field: 'last_name', label: 'Last Name', required: false },
        { field: 'phone', label: 'Phone', required: false },
        { field: 'company', label: 'Company', required: false }
    ];
    
    fieldsDiv.innerHTML = fields.map(field => `
        <div class="col-md-4 mb-2">
            <label class="form-label small">${field.label} ${field.required ? '*' : ''}</label>
            <select class="form-select form-select-sm column-map" data-field="${field.field}" data-required="${field.required}">
                <option value="">-- Select --</option>
                ${contactsState.importColumns.map(col => `<option value="${col}">${col}</option>`).join('')}
            </select>
        </div>
    `).join('');
    
    // Auto-map
    document.querySelectorAll('.column-map').forEach(select => {
        const field = select.dataset.field;
        const match = contactsState.importColumns.find(col => 
            col.toLowerCase().includes(field.toLowerCase())
        );
        if (match) select.value = match;
    });
    
    mappingDiv.classList.remove('d-none');
    
    // Preview
    const previewDiv = document.getElementById('importPreview');
    const previewTable = document.getElementById('importPreviewTable');
    const previewData = contactsState.importData.slice(0, 5);
    
    previewTable.innerHTML = `
        <thead><tr>${contactsState.importColumns.map(col => `<th>${col}</th>`).join('')}</tr></thead>
        <tbody>${previewData.map(row => `
            <tr>${contactsState.importColumns.map(col => `<td>${row[col] || ''}</td>`).join('')}</tr>
        `).join('')}</tbody>
    `;
    
    previewDiv.classList.remove('d-none');
    document.getElementById('importBtn').disabled = false;
}

async function importContacts() {
    const mappings = {};
    let hasRequired = true;
    
    document.querySelectorAll('.column-map').forEach(select => {
        if (select.value) {
            mappings[select.dataset.field] = select.value;
        } else if (select.dataset.required === 'true') {
            hasRequired = false;
        }
    });
    
    if (!hasRequired) {
        showToast('First Name and Email mapping required', 'error');
        return;
    }
    
    const contactsToImport = contactsState.importData.map(row => ({
        email: (row[mappings.email] || '').toLowerCase().trim(),
        first_name: row[mappings.first_name] || '',
        last_name: row[mappings.last_name] || '',
        phone: row[mappings.phone] || '',
        company: row[mappings.company] || ''
    })).filter(c => c.email && c.email.includes('@'));
    
    if (contactsToImport.length === 0) {
        showToast('No valid contacts', 'error');
        return;
    }
    
    try {
        let importCount = 0;
        let skipCount = 0;
        
        for (let i = 0; i < contactsToImport.length; i += 50) {
            const batch = contactsToImport.slice(i, i + 50);
            
            const { data, error } = await gbSupabase.client
                .from('contacts')
                .upsert(
                    batch.map(c => ({
                        ...c,
                        user_id: gbApp.currentUser.id,
                        status: 'active'
                    })),
                    { onConflict: 'user_id,email', ignoreDuplicates: true }
                );
            
            if (error) {
                skipCount += batch.length;
            } else {
                importCount += data ? data.length : batch.length;
                skipCount += batch.length - (data ? data.length : 0);
            }
        }
        
        bootstrap.Modal.getInstance(document.getElementById('importModal')).hide();
        showToast(`Imported ${importCount}, skipped ${skipCount}`, 'success');
        loadContacts();
        
    } catch (error) {
        showToast('Error: ' + error.message, 'error');
    }
}

function showBulkEmailModal() {
    const count = contactsState.selectedContacts.size || contactsState.filteredContacts.length;
    
    if (count === 0) {
        showToast('No contacts to send email', 'error');
        return;
    }
    
    document.getElementById('sendEmailCount').textContent = count;
    document.getElementById('bulkEmailSubject').value = '';
    document.getElementById('bulkEmailContent').value = '';
    
    new bootstrap.Modal(document.getElementById('sendEmailModal')).show();
}

async function sendBulkEmail() {
    const subject = document.getElementById('bulkEmailSubject').value.trim();
    const content = document.getElementById('bulkEmailContent').value.trim();
    
    if (!subject || !content) {
        showToast('Subject and message required', 'error');
        return;
    }
    
    let recipients = [];
    if (contactsState.selectedContacts.size > 0) {
        recipients = contactsState.allContacts.filter(c => contactsState.selectedContacts.has(c.id));
    } else {
        recipients = contactsState.filteredContacts;
    }
    
    if (recipients.length === 0) {
        showToast('No recipients found', 'error');
        return;
    }
    
    try {
        showToast(`Sending to ${recipients.length} contacts...`, 'info');
        
        let sentCount = 0;
        let failCount = 0;
        
        for (const contact of recipients) {
            // Personalize
            let personalized = content;
            personalized = personalized.replace(/\{\{first_name\}\}/g, contact.first_name || '');
            personalized = personalized.replace(/\{\{last_name\}\}/g, contact.last_name || '');
            personalized = personalized.replace(/\{\{email\}\}/g, contact.email || '');
            personalized = personalized.replace(/\{\{company\}\}/g, contact.company || '');
            
            try {
                const response = await fetch(
                    'https://cqvcdbnkmtgdpnldeejq.supabase.co/functions/v1/send-email',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${gbApp.currentUser.id}`
                        },
                        body: JSON.stringify({
                            to: contact.email,
                            subject: subject,
                            html: personalized,
                            fromName: 'GB Mailer'
                        })
                    }
                );
                
                const result = await response.json();
                
                if (result.success) {
                    sentCount++;
                    
                    // Log in Supabase
                    await gbSupabase.insert('email_logs', {
                        user_id: gbApp.currentUser.id,
                        contact_id: contact.id,
                        email: contact.email,
                        subject: subject,
                        content: personalized,
                        status: 'sent',
                        sent_at: new Date().toISOString()
                    });
                } else {
                    failCount++;
                }
                
            } catch (error) {
                failCount++;
            }
            
            // 100ms delay (rate limiting se bachne ke liye)
            await new Promise(resolve => setTimeout(resolve, 100));
        }
        
        bootstrap.Modal.getInstance(document.getElementById('sendEmailModal')).hide();
        showToast(`Sent: ${sentCount}, Failed: ${failCount}`, sentCount > 0 ? 'success' : 'error');
        
        contactsState.selectedContacts.clear();
        document.getElementById('selectAllContacts').checked = false;
        renderContacts();
        
    } catch (error) {
        showToast('Error: ' + error.message, 'error');
    }
}

function insertBulkVariable(variable) {
    const textarea = document.getElementById('bulkEmailContent');
    const cursorPos = textarea.selectionStart;
    const textBefore = textarea.value.substring(0, cursorPos);
    const textAfter = textarea.value.substring(cursorPos);
    textarea.value = textBefore + variable + textAfter;
    textarea.focus();
}
