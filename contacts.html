<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - GB Mailer</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,.1);
        }

        .header h1 {
            white-space: nowrap;
        }

        .header-actions,
        .form-actions,
        .mapping-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }

        .btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .btn-primary { background: #007bff; }
        .btn-primary:hover { background: #0056b3; }

        .btn-success { background: #28a745; }
        .btn-success:hover { background: #1e7e34; }

        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #545b62; }

        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #b02a37; }

        .btn-sm {
            padding: 5px 9px;
            font-size: 12px;
        }

        .search-bar {
            margin-bottom: 12px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        #pageStatus {
            min-height: 22px;
            margin-bottom: 12px;
            color: #555;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,.1);
        }

        table {
            width: 100%;
            min-width: 750px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e3e3e3;
        }

        th {
            background: #f8f9fa;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .pagination-controls {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .pagination-controls button {
            padding: 8px 13px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }

        .pagination-controls button.active {
            background: #007bff;
            border-color: #007bff;
            color: white;
        }

        .pagination-controls button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0,0,0,.55);
        }

        .modal-content {
            position: relative;
            width: 100%;
            max-width: 900px;
            margin: 30px auto;
            padding: 28px;
            background: white;
            border-radius: 10px;
        }

        .close {
            position: absolute;
            top: 10px;
            right: 18px;
            color: #999;
            font-size: 28px;
            cursor: pointer;
        }

        .close:hover {
            color: #222;
        }

        .upload-area {
            margin: 20px 0;
            padding: 40px 20px;
            text-align: center;
            border: 2px dashed #ccc;
            border-radius: 10px;
        }

        .upload-area input {
            display: block;
            margin: 18px auto;
        }

        .form-group {
            margin: 18px 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
        }

        .mapping-table {
            width: 100%;
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 28px;
            margin: 20px 0;
            overflow: hidden;
            border-radius: 15px;
            background: #eee;
        }

        #progressBar {
            width: 0;
            height: 100%;
            background: #28a745;
            transition: width .3s;
        }

        .empty {
            padding: 45px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions .btn {
                flex: 1;
            }

            .modal-content {
                margin: 10px auto;
                padding: 22px 16px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>
            <i class="fas fa-address-book"></i>
            Contacts
        </h1>

        <div class="header-actions">
            <button class="btn btn-primary" onclick="showUploadModal()">
                <i class="fas fa-upload"></i>
                Upload Contacts
            </button>

            <button class="btn btn-success"
                    id="sendSelectedBtn"
                    onclick="sendSelected()"
                    disabled>
                <i class="fas fa-envelope"></i>
                Send Selected (<span id="selectedCount">0</span>)
            </button>

            <button class="btn btn-secondary" onclick="loadContacts()">
                <i class="fas fa-sync"></i>
                Refresh
            </button>
        </div>
    </div>

    <div class="search-bar">
        <input id="searchInput"
               type="search"
               placeholder="Search by name, email, phone, or company">
    </div>

    <div id="pageStatus"></div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th>
                    <input type="checkbox" id="selectAll">
                </th>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Company</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody id="contactsBody">
            <tr>
                <td colspan="7" class="empty">Loading contacts...</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div id="pagination" class="pagination"></div>
</div>

<!-- Upload modal -->
<div id="uploadModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('uploadModal')">&times;</span>

        <h2>
            <i class="fas fa-file-import"></i>
            Import Contacts
        </h2>

        <div id="step1">
            <div class="upload-area">
                <p>
                    <i class="fas fa-file-excel"
                       style="font-size:50px;color:#217346"></i>
                </p>

                <p style="margin-top:12px">
                    Select a CSV, XLSX, or XLS file.
                </p>

                <input id="fileInput"
                       type="file"
                       accept=".csv,.xlsx,.xls">

                <button class="btn btn-primary" onclick="previewFile()">
                    <i class="fas fa-eye"></i>
                    Preview File
                </button>
            </div>
        </div>

        <div id="step2" style="display:none">
            <h3>Map Columns</h3>
            <p style="margin-top:8px">
                Map the email column. Other columns are optional.
            </p>

            <div id="columnMapping"></div>

            <div class="mapping-actions">
                <button class="btn btn-success" onclick="confirmMapping()">
                    <i class="fas fa-check"></i>
                    Confirm Import
                </button>

                <button class="btn btn-secondary" onclick="goBack()">
                    Back
                </button>
            </div>
        </div>

        <div id="step3" style="display:none">
            <h3>Importing Contacts</h3>

            <div class="progress-bar">
                <div id="progressBar"></div>
            </div>

            <p id="importStatus">Preparing import...</p>
        </div>
    </div>
</div>

<!-- Email modal -->
<div id="emailModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('emailModal')">&times;</span>

        <h2>
            <i class="fas fa-paper-plane"></i>
            Create Email Campaign
        </h2>

        <p style="margin-top:10px">
            Recipients:
            <strong><span id="recipientCount">0</span></strong>
        </p>

        <input type="hidden" id="contactIds">

        <div class="form-group">
            <label for="emailSubject">Subject *</label>
            <input id="emailSubject"
                   type="text"
                   maxlength="200"
                   required
                   placeholder="Email subject">
        </div>

        <div class="form-group">
            <label for="emailBody">
                Message *
                <small>
                    Available fields:
                    {{first_name}}, {{last_name}}, {{company}}, {{email}}
                </small>
            </label>

            <textarea id="emailBody"
                      rows="10"
                      required
                      placeholder="Write your email here..."></textarea>
        </div>

        <div class="form-group">
            <label for="templateName">Template name, optional</label>
            <input id="templateName"
                   type="text"
                   maxlength="100"
                   placeholder="Example: Monthly update">
        </div>

        <div class="form-actions">
            <button id="sendEmailsBtn"
                    class="btn btn-success"
                    onclick="sendEmails()">
                <i class="fas fa-paper-plane"></i>
                Queue Campaign
            </button>

            <button class="btn btn-secondary"
                    onclick="closeModal('emailModal')">
                Cancel
            </button>
        </div>
    </div>
</div>

<script>
"use strict";

/*
 * Change this to your Render backend.
 * Example:
 * https://gb-mailer-api.onrender.com
 */
const API_BASE_URL = "https://YOUR-RENDER-SERVICE.onrender.com";

const PAGE_SIZE = 50;

let contacts = [];
let filteredContacts = [];
let currentPage = 1;
let selectedIds = new Set();

let importedRows = [];
let importedHeaders = [];
let columnMap = {};

const $ = (id) => document.getElementById(id);

document.addEventListener("DOMContentLoaded", () => {
    $("searchInput").addEventListener("input", searchContacts);
    $("selectAll").addEventListener("change", toggleAll);
    loadContacts();
});

function getAccessToken() {
    return localStorage.getItem("access_token") ||
           localStorage.getItem("token") ||
           localStorage.getItem("jwt") ||
           "";
}

function requestHeaders() {
    const token = getAccessToken();

    return {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
    };
}

async function apiRequest(path, options = {}) {
    const response = await fetch(`${API_BASE_URL}${path}`, {
        ...options,
        headers: {
            ...requestHeaders(),
            ...(options.headers || {})
        }
    });

    const type = response.headers.get("content-type") || "";
    const data = type.includes("application/json")
        ? await response.json()
        : await response.text();

    if (!response.ok) {
        throw new Error(
            typeof data === "object" && data.message
                ? data.message
                : `Request failed: ${response.status}`
        );
    }

    return data;
}

function setStatus(message, error = false) {
    $("pageStatus").textContent = message;
    $("pageStatus").style.color = error ? "#dc3545" : "#555";
}

async function loadContacts() {
    try {
        setStatus("Loading contacts...");

        const result = await apiRequest("/api/contacts");

        contacts = Array.isArray(result)
            ? result
            : result.contacts || result.data || [];

        filteredContacts = [...contacts];
        currentPage = 1;

        renderContacts();
        setStatus(`${contacts.length} contacts loaded.`);
    } catch (error) {
        console.error(error);
        setStatus(error.message, true);

        $("contactsBody").innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    Could not load contacts.
                </td>
            </tr>
        `;
    }
}

function renderContacts() {
    const body = $("contactsBody");

    if (!filteredContacts.length) {
        body.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No contacts found.
                </td>
            </tr>
        `;

        $("pagination").innerHTML = "";
        updateSelectionDisplay();
        return;
    }

    const start = (currentPage - 1) * PAGE_SIZE;
    const pageContacts = filteredContacts.slice(start, start + PAGE_SIZE);

    body.innerHTML = pageContacts.map((contact, index) => {
        const id = String(contact.id || "");
        const name = contact.name ||
            [contact.first_name, contact.last_name]
                .filter(Boolean)
                .join(" ");

        return `
            <tr>
                <td>
                    <input type="checkbox"
                           class="contact-checkbox"
                           value="${escapeHtml(id)}"
                           ${selectedIds.has(id) ? "checked" : ""}
                           onchange="toggleContact('${escapeHtml(id)}', this.checked)">
                </td>

                <td>${start + index + 1}</td>
                <td>${escapeHtml(name)}</td>
                <td>${escapeHtml(contact.email || "")}</td>
                <td>${escapeHtml(contact.phone || "")}</td>
                <td>${escapeHtml(contact.company || "")}</td>

                <td>
                    <button class="btn btn-danger btn-sm"
                            onclick="deleteContact('${escapeHtml(id)}')">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    }).join("");

    renderPagination();
    updateSelectionDisplay();
    updateSelectAllState();
}

function renderPagination() {
    const totalPages = Math.ceil(filteredContacts.length / PAGE_SIZE);

    if (totalPages <= 1) {
        $("pagination").innerHTML = "";
        return;
    }

    let html = `
        <div class="pagination-controls">
            <button onclick="changePage(${currentPage - 1})"
                    ${currentPage === 1 ? "disabled" : ""}>
                Previous
            </button>
    `;

    for (let page = 1; page <= totalPages; page++) {
        if (
            page === 1 ||
            page === totalPages ||
            Math.abs(page - currentPage) <= 2
        ) {
            html += `
                <button class="${page === currentPage ? "active" : ""}"
                        onclick="changePage(${page})">
                    ${page}
                </button>
            `;
        }
    }

    html += `
            <button onclick="changePage(${currentPage + 1})"
                    ${currentPage === totalPages ? "disabled" : ""}>
                Next
            </button>
        </div>
    `;

    $("pagination").innerHTML = html;
}

function changePage(page) {
    const totalPages = Math.ceil(filteredContacts.length / PAGE_SIZE);

    if (page < 1 || page > totalPages) return;

    currentPage = page;
    renderContacts();
}

function searchContacts() {
    const query = $("searchInput").value.toLowerCase().trim();

    filteredContacts = contacts.filter(contact =>
        Object.values(contact).some(value =>
            String(value ?? "").toLowerCase().includes(query)
        )
    );

    currentPage = 1;
    renderContacts();
}

function toggleContact(id, checked) {
    if (checked) selectedIds.add(id);
    else selectedIds.delete(id);

    updateSelectionDisplay();
    updateSelectAllState();
}

function toggleAll() {
    const checked = $("selectAll").checked;
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageContacts = filteredContacts.slice(start, start + PAGE_SIZE);

    for (const contact of pageContacts) {
        const id = String(contact.id || "");

        if (checked) selectedIds.add(id);
        else selectedIds.delete(id);
    }

    renderContacts();
}

function updateSelectionDisplay() {
    $("selectedCount").textContent = selectedIds.size;
    $("sendSelectedBtn").disabled = selectedIds.size === 0;
}

function updateSelectAllState() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const pageContacts = filteredContacts.slice(start, start + PAGE_SIZE);

    $("selectAll").checked =
        pageContacts.length > 0 &&
        pageContacts.every(contact =>
            selectedIds.has(String(contact.id))
        );
}

function showUploadModal() {
    $("uploadModal").style.display = "block";
    goBack();
}

function showEmailModal() {
    $("emailModal").style.display = "block";
}

function closeModal(id) {
    $(id).style.display = "none";
}

window.addEventListener("click", event => {
    if (event.target.classList.contains("modal")) {
        event.target.style.display = "none";
    }
});

function sendSelected() {
    if (!selectedIds.size) {
        alert("Select at least one contact.");
        return;
    }

    $("recipientCount").textContent = selectedIds.size;
    $("contactIds").value = JSON.stringify([...selectedIds]);
    showEmailModal();
}

async function sendEmails() {
    const subject = $("emailSubject").value.trim();
    const bodyHtml = $("emailBody").value.trim();
    const contactIds = JSON.parse($("contactIds").value || "[]");

    if (!subject || !bodyHtml) {
        alert("Subject and message are required.");
        return;
    }

    if (!contactIds.length) {
        alert("No contacts selected.");
        return;
    }

    if (contactIds.length > 500) {
        alert("A campaign cannot contain more than 500 contacts.");
        return;
    }

    const button = $("sendEmailsBtn");

    try {
        button.disabled = true;
        button.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Queueing...';

        const result = await apiRequest("/api/campaigns", {
            method: "POST",
            body: JSON.stringify({
                subject,
                bodyHtml,
                contactIds,
                templateName: $("templateName").value.trim()
            })
        });

        closeModal("emailModal");

        const campaignId =
            result.id ||
            result.campaignId ||
            result.campaign?.id;

        setStatus(
            `${contactIds.length} email jobs queued successfully.`
        );

        if (campaignId) {
            monitorCampaign(campaignId);
        }
    } catch (error) {
        console.error(error);
        alert(`Could not queue campaign: ${error.message}`);
    } finally {
        button.disabled = false;
        button.innerHTML =
            '<i class="fas fa-paper-plane"></i> Queue Campaign';
    }
}

function monitorCampaign(campaignId) {
    const timer = setInterval(async () => {
        try {
            const result = await apiRequest(
                `/api/campaigns/${encodeURIComponent(campaignId)}`
            );

            const campaign = result.campaign || result;

            const total = Number(
                campaign.total_count ?? campaign.total ?? 0
            );

            const sent = Number(
                campaign.sent_count ?? campaign.sent ?? 0
            );

            const failed = Number(
                campaign.failed_count ?? campaign.failed ?? 0
            );

            const remaining = Math.max(total - sent - failed, 0);

            setStatus(
                `Campaign progress: ${sent} sent, ` +
                `${failed} failed, ${remaining} remaining.`
            );

            const status = String(campaign.status || "").toLowerCase();

            if (["completed", "failed", "cancelled"].includes(status)) {
                clearInterval(timer);
            }
        } catch (error) {
            console.error("Progress error:", error);
            clearInterval(timer);
        }
    }, 3000);
}

function previewFile() {
    const file = $("fileInput").files[0];

    if (!file) {
        alert("Choose a CSV or Excel file first.");
        return;
    }

    const extension = file.name
        .slice(file.name.lastIndexOf("."))
        .toLowerCase();

    if (![".csv", ".xlsx", ".xls"].includes(extension)) {
        alert("Only CSV, XLSX, and XLS files are supported.");
        return;
    }

    const reader = new FileReader();

    reader.onload = event => {
        try {
            const workbook = XLSX.read(event.target.result, {
                type: "array"
            });

            const worksheet =
                workbook.Sheets[workbook.SheetNames[0]];

            importedRows = XLSX.utils.sheet_to_json(worksheet, {
                defval: "",
                raw: false
            });

            if (!importedRows.length) {
                alert("The file contains no data rows.");
                return;
            }

            importedHeaders = Object.keys(importedRows[0]);
            createColumnMapping();

            $("step1").style.display = "none";
            $("step2").style.display = "block";
        } catch (error) {
            console.error(error);
            alert("The selected file could not be read.");
        }
    };

    reader.readAsArrayBuffer(file);
}

function createColumnMapping() {
    const normalized = importedHeaders.map(header => ({
        original: header,
        value: header.toLowerCase().replace(/[^a-z0-9]/g, "")
    }));

    function findHeader(possibleNames) {
        const found = normalized.find(item =>
            possibleNames.includes(item.value)
        );

        return found ? found.original : "";
    }

    columnMap = {
        email: findHeader(["email", "emailaddress", "mail"]),
        first_name: findHeader(["firstname", "givenname", "name"]),
        last_name: findHeader(["lastname", "surname", "familyname"]),
        phone: findHeader(["phone", "phonenumber", "mobile", "telephone"]),
        company: findHeader(["company", "companyname", "organization"])
    };

    const fields = [
        ["email", "Email", true],
        ["first_name", "First name", false],
        ["last_name", "Last name", false],
        ["phone", "Phone", false],
        ["company", "Company", false]
    ];

    $("columnMapping").innerHTML = `
        <table class="mapping-table">
            <thead>
                <tr>
                    <th>Contact field</th>
                    <th>File column</th>
                </tr>
            </thead>
            <tbody>
                ${fields.map(([field, label, required]) => `
                    <tr>
                        <td>${label}${required ? " *" : ""}</td>
                        <td>
                            <select data-field="${field}">
                                <option value="">Do not import</option>
                                ${importedHeaders.map(header => `
                                    <option value="${escapeHtml(header)}"
                                        ${columnMap[field] === header ? "selected" : ""}>
                                        ${escapeHtml(header)}
                                    </option>
                                `).join("")}
                            </select>
                        </td>
                    </tr>
                `).join("")}
            </tbody>
        </table>

        <p>${importedRows.length} rows detected.</p>
    `;
}

async function confirmMapping() {
    document.querySelectorAll("#columnMapping select").forEach(select => {
        columnMap[select.dataset.field] = select.value;
    });

    if (!columnMap.email) {
        alert("You must map an Email column.");
        return;
    }

    const validContacts = [];

    for (const row of importedRows) {
        const email = String(row[columnMap.email] || "")
            .trim()
            .toLowerCase();

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            continue;
        }

        const metadata = {};

        for (const header of importedHeaders) {
            if (!Object.values(columnMap).includes(header) &&
                row[header] !== "") {
                metadata[header] = row[header];
            }
        }

        validContacts.push({
            email,
            first_name: mappedValue(row, "first_name"),
            last_name: mappedValue(row, "last_name"),
            phone: mappedValue(row, "phone"),
            company: mappedValue(row, "company"),
            metadata
        });
    }

    const uniqueContacts = [
        ...new Map(
            validContacts.map(contact => [contact.email, contact])
        ).values()
    ];

    if (!uniqueContacts.length) {
        alert("No valid email addresses were found.");
        return;
    }

    $("step2").style.display = "none";
    $("step3").style.display = "block";
    $("progressBar").style.width = "25%";
    $("importStatus").textContent =
        `Uploading ${uniqueContacts.length} contacts...`;

    try {
        const result = await apiRequest("/api/contacts/import", {
            method: "POST",
            body: JSON.stringify({
                contacts: uniqueContacts
            })
        });

        $("progressBar").style.width = "100%";

        $("importStatus").textContent =
            `Import complete. ${
                result.imported ?? uniqueContacts.length
            } imported, ${
                result.skipped ?? 0
            } skipped.`;

        setTimeout(() => {
            closeModal("uploadModal");
            loadContacts();
        }, 1200);
    } catch (error) {
        console.error(error);
        $("progressBar").style.background = "#dc3545";
        $("importStatus").textContent =
            `Import failed: ${error.message}`;
    }
}

function mappedValue(row, field) {
    const header = columnMap[field];
    return header ? String(row[header] || "").trim() : "";
}

function goBack() {
    $("step1").style.display = "block";
    $("step2").style.display = "none";
    $("step3").style.display = "none";
    $("progressBar").style.width = "0%";
    $("progressBar").style.background = "#28a745";
    $("fileInput").value = "";
    importedRows = [];
    importedHeaders = [];
    columnMap = {};
}

async function deleteContact(id) {
    if (!id || !confirm("Delete this contact?")) return;

    try {
        await apiRequest(`/api/contacts/${encodeURIComponent(id)}`, {
            method: "DELETE"
        });

        selectedIds.delete(id);
        await loadContacts();
    } catch (error) {
        console.error(error);
        alert(`Could not delete contact: ${error.message}`);
    }
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
</script>
